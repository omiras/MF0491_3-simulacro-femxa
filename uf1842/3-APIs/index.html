<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <title>Rick and Morty API</title>
</head>

<body>
  <main class="container">
    <h1>Personaje aleatorio</h1>
    <article>
      <header>Datos obtenidos de Rick and Morty API</header>
      <img id="photo" src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" alt="Foto del personaje aleatorio">
      <dl>
        <dt>Nombre</dt>
        <dd id="first">Rick Sanchez</dd>
        <dt>Estado</dt>
        <dd id="last">Alive</dd>
        <dt>Especie</dt>
        <dd id="country">Human</dd>
        <dt>Género</dt>
        <dd id="phone">Male</dd>
        <dt>Origen</dt>
        <dd id="email">Earth (C-137)</dd>
      </dl>
      <footer>
        <button type="button" id="btn">Obtener nuevo personaje</button>
      </footer>
    </article>
  </main>

  <script src="app.js"></script>
</body>

</html>
