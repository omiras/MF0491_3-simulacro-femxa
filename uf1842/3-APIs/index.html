<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <title>Consulta del tiempo</title>
</head>

<body>
  <main class="container">
    <h1>Consulta del tiempo</h1>
    <article>
      <header>Datos meteorológicos</header>

      <label for="citySelect">Selecciona una ciudad</label>
      <select id="citySelect">
        <option value="Madrid">Madrid</option>
        <option value="Barcelona">Barcelona</option>
        <option value="Valencia">Valencia</option>
      </select>

      <dl>
        <dt>Ciudad</dt>
        <dd id="city">Madrid, España</dd>

        <dt>Temperatura actual</dt>
        <dd id="temp">--</dd>

        <dt>Sensación térmica</dt>
        <dd id="feels">--</dd>

        <dt>Estado</dt>
        <dd id="summary">--</dd>

        <dt>Mínima / Máxima</dt>
        <dd id="range">--</dd>

        <dt>Previsión</dt>
        <dd id="forecast">--</dd>
      </dl>

      <footer>
        <button type="button" id="btn">Consultar clima</button>
      </footer>
    </article>
  </main>

  <script src="app.js"></script>
</body>

</html>
