<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

    :root {
      --bg-top: #09150d;
      --bg-mid: #112c1c;
      --bg-bottom: #0b2317;
      --panel: rgba(8, 18, 11, 0.78);
      --panel-border: rgba(133, 255, 172, 0.5);
      --accent: #8bf5a5;
      --accent-strong: #4eea7d;
      --text: #e9fff0;
      --muted: #a8d2b0;
      --shadow: rgba(70, 255, 134, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Rajdhani', sans-serif;
      background:
        radial-gradient(circle at top, rgba(116, 255, 174, 0.14), transparent 30%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 2px solid rgba(139, 245, 165, 0.2);
      box-shadow: 0 0 35px rgba(78, 234, 125, 0.2);
      z-index: 0;
    }

    body::before {
      top: -110px;
      right: -80px;
      transform: rotate(18deg);
    }

    body::after {
      bottom: -150px;
      left: -100px;
      transform: rotate(-10deg);
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(90vw, 460px);
      padding: 1rem 0;
    }

    h1 {
      margin: 0 0 1rem;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(139, 245, 165, 0.6);
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    article {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(139, 245, 165, 0.15), 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 24px rgba(78, 234, 125, 0.18);
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    article header {
      background: linear-gradient(90deg, rgba(139,245,165,0.14), rgba(78,234,125,0.04), rgba(139,245,165,0.14));
      color: var(--muted);
      padding: 0.9rem 1.1rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid rgba(139,245,165,0.2);
    }

    .photo-wrap {
      padding: 1rem 1rem 0.3rem;
      display: flex;
      justify-content: center;
    }

    img {
      display: block;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid rgba(139, 245, 165, 0.8);
      box-shadow: 0 0 25px rgba(139, 245, 165, 0.35);
      object-fit: cover;
      background: #143321;
    }

    dl {
      margin: 0;
      padding: 1rem 1.1rem 0.25rem;
      display: grid;
      gap: 0.7rem;
    }

    dt {
      color: var(--accent);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 1px solid rgba(139,245,165,0.12);
      padding-bottom: 0.28rem;
    }

    dd {
      margin: 0 0 0.2rem;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    footer {
      padding: 1rem 1rem 1.2rem;
    }

    button {
      width: 100%;
      border: 2px solid rgba(12, 46, 24, 0.9);
      border-radius: 999px;
      background: linear-gradient(135deg, #d9ff8c 0%, #7ef7a1 25%, #41e779 55%, #1bba5a 100%);
      color: #041b0b;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 0 3px rgba(138, 255, 185, 0.2), 0 10px 26px rgba(47, 214, 101, 0.65), inset 0 2px 0 rgba(255,255,255,0.7);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      font-family: 'Orbitron', sans-serif;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 0 0 3px rgba(138, 255, 185, 0.3), 0 12px 28px rgba(47, 214, 101, 0.8), inset 0 2px 0 rgba(255,255,255,0.85);
      filter: brightness(1.08);
    }
  </style>
  <title>Rick and Morty API</title>
</head>

<body>
  <main class="container">
    <h1>Personaje aleatorio</h1>
    <article>
      <header>Datos obtenidos de Rick and Morty API</header>
      <div class="photo-wrap">
        <img id="photo" src="https://placehold.co/200x200/0b2317/8bf5a5?text=RV" alt="Avatar placeholder">
      </div>
      <dl>
        <dt>Nombre</dt>
        <dd id="character-name"></dd>

        <dt>Estado</dt>
        <dd id="character-status"></dd>

        <dt>Especie</dt>
        <dd id="character-species"></dd>

        <dt>Género</dt>
        <dd id="character-gender"></dd>

        <dt>Origen</dt>
        <dd id="character-origin"></dd>
      </dl>
      <footer>
        <button type="button" id="btn">Obtener nuevo personaje</button>
      </footer>
    </article>
  </main>

  <script src="app.js"></script>
</body>

</html>
